name: Continuous Integration (LPMQ CI)

on:
  push:
    branches: [ main, feature/**, implementationSprint0 ]
  pull_request:
    branches: [ main, feature/**, implementationSprint0 ]

jobs:
  backend-test:
    name: Backend Lint, Schema & Integration Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lpmq_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

      - name: Validate Prisma Schema
        working-directory: backend
        run: npx prisma validate

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate

      - name: Apply Prisma Migrations
        working-directory: backend
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/lpmq_db"
        run: npx prisma migrate deploy

      - name: Seed Database
        working-directory: backend
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/lpmq_db"
          SEED_DEFAULT_PASSWORD: "password123"
        run: node prisma/seed.js

      - name: Run Backend Integration & Negative Tests
        working-directory: backend
        env:
          DATABASE_URL: "mysql://root:root@127.0.0.1:3306/lpmq_db"
          JWT_SECRET: "test_jwt_secret_key_ci_environment_32chars"
          NODE_ENV: test
        run: npm test

  frontend-test:
    name: Frontend Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Run Frontend Component Tests
        working-directory: frontend
        run: npm test

      - name: Build Frontend Application
        working-directory: frontend
        run: npm run build
