<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Definisi Gradient Warna Kemenag & LPMQ -->
  <defs>
    <linearGradient id="lpmqGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#146C43" />
      <stop offset="100%" stop-color="#0B462D" />
    </linearGradient>
    <linearGradient id="lpmqGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="quranPage" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#062819" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Latar Belakang Perisai Bulat Halus (Shield Modern Kemenag) -->
  <rect width="64" height="64" rx="16" fill="url(#lpmqGreen)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#lpmqGold)" stroke-width="1.8" stroke-opacity="0.85" />

  <!-- Ornamen Kubah / Bintang Rub el Hizb Halus di Latar -->
  <g opacity="0.18" stroke="#FDE68A" stroke-width="1" fill="none">
    <rect x="20" y="20" width="24" height="24" rx="2" transform="rotate(45 32 32)" />
    <circle cx="32" cy="32" r="15" />
  </g>

  <!-- Lambang Utama: Mushaf Terbuka & Pena / Cahaya Kaligrafi -->
  <g filter="url(#shadow)">
    <!-- Halaman Mushaf Kiri -->
    <path d="M32 44C27.5 41 21.5 40 14 41.5V20.5C21.5 19 27.5 20.2 32 23.5V44Z" fill="url(#quranPage)" stroke="#0E5139" stroke-width="0.8" />
    <!-- Garis Ayat Mushaf Kiri -->
    <line x1="18" y1="24.5" x2="28" y2="26" stroke="#0E5139" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
    <line x1="18" y1="29.5" x2="28" y2="31" stroke="#0E5139" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
    <line x1="18" y1="34.5" x2="26" y2="35.8" stroke="#0E5139" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />

    <!-- Halaman Mushaf Kanan -->
    <path d="M32 44C36.5 41 42.5 40 50 41.5V20.5C42.5 19 36.5 20.2 32 23.5V44Z" fill="url(#quranPage)" stroke="#0E5139" stroke-width="0.8" />
    <!-- Garis Ayat Mushaf Kanan -->
    <line x1="36" y1="26" x2="46" y2="24.5" stroke="#0E5139" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
    <line x1="36" y1="31" x2="46" y2="29.5" stroke="#0E5139" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />
    <line x1="38" y1="35.8" x2="46" y2="34.5" stroke="#0E5139" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />

    <!-- Simpul Tengah Mushaf (Spine Emas) -->
    <path d="M30.8 23C31.5 22.5 32.5 22.5 33.2 23V44.5C32.5 44 31.5 44 30.8 44.5V23Z" fill="url(#lpmqGold)" />

    <!-- Bintang Segi Delapan Emas (Rub el Hizb) di Atas Mushaf Melambangkan Keotentikan & Tashih Mushaf -->
    <g transform="translate(32, 14) scale(0.65)">
      <rect x="-6" y="-6" width="12" height="12" fill="url(#lpmqGold)" />
      <rect x="-6" y="-6" width="12" height="12" fill="url(#lpmqGold)" transform="rotate(45)" />
      <circle cx="0" cy="0" r="2.5" fill="#0E5139" />
    </g>

    <!-- Tanda Centang / Tashih Halus di Bawah -->
    <circle cx="32" cy="48" r="4.5" fill="url(#lpmqGold)" />
    <path d="M30 48L31.5 49.5L34 46.5" stroke="#062819" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>